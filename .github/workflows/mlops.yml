name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV


      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        run: |
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        # BONUS 1: Tich hop DagsHub MLflow Remote Tracking
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py


      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage
        # TODO 5 & BONUS 4: Upload model va metrics.json len Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          
          # Upload model.pkl
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print(f"Uploaded models/model.pkl to gs://{bucket_name}/models/latest/model.pkl")

          # Upload metrics.json cho Guardrail so sanh (Bonus 4)
          blob_metrics = bucket.blob("models/latest/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print(f"Uploaded outputs/metrics.json to gs://{bucket_name}/models/latest/metrics.json")
          EOF

      - name: Save metrics and performance report as artifact
        # BONUS 3: Luu tru ca metrics.json va report.txt thanh artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.60) & Guardrail Rollback (Bonus 4).
  # Pipeline dung lai o day neu mo hinh bi suy giam do chinh xac.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-cloud-storage

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Check eval gate & model rollback guardrail
        # BONUS 4: So sanh accuracy model moi voi model dang chay tren Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          import json
          import sys
          from google.cloud import storage

          new_acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"--- [EVALUATION GATE] ---")
          print(f"New Model Accuracy: {new_acc:.4f}")

          # 1. Kiem tra nguong chat luong toi thieu
          if new_acc < 0.60:
              raise SystemExit(f"FAILED: accuracy {new_acc:.4f} < 0.60 (Minimum Quality Threshold). Deployment Aborted!")
          print("PASSED: Model đạt ngưỡng chất lượng cơ bản (>= 0.60).")

          # 2. [BONUS 4]: Guardrail so sanh voi mo hinh cu
          bucket_name = os.environ.get("CLOUD_BUCKET")
          try:
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("models/latest/metrics.json")
              if blob.exists():
                  blob.download_to_filename("/tmp/prev_metrics.json")
                  prev_data = json.load(open("/tmp/prev_metrics.json"))
                  prev_acc = float(prev_data.get("accuracy", 0.0))
                  print(f"--- [BONUS 4: MODEL ROLLBACK GUARDRAIL] ---")
                  print(f"Current Deployed Model Accuracy: {prev_acc:.4f}")
                  print(f"New Trained Model Accuracy:      {new_acc:.4f}")

                  if new_acc < (prev_acc - 0.05): # Neu giam dang ke
                      raise SystemExit(f"FAILED [ROLLBACK GUARDRAIL]: New model ({new_acc:.4f}) is degraded compared to production ({prev_acc:.4f}). Aborting deployment!")
                  else:
                      print(f"PASSED [ROLLBACK GUARDRAIL]: New model is safe and ready for deployment.")
          except Exception as e:
              print(f"Info: Could not perform rollback comparison ({e}). Proceeding normally.")

          print("ALL EVAL GATES PASSED: Đang tiến hành triển khai lên Production VM...")
          EOF



  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            # TODO 8: Cho server san sang roi goi curl /health de xac nhan.
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1

