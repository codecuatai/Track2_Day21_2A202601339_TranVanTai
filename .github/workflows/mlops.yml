name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mlops-production
  cancel-in-progress: false


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV


      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        run: |
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        # BONUS 1: Tich hop DagsHub MLflow Remote Tracking
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: wine-quality-ci
        run: |
          # Khong cho phep job "xanh" neu remote tracking secrets chua duoc cau hinh.
          test -n "$MLFLOW_TRACKING_URI"
          test -n "$MLFLOW_TRACKING_USERNAME"
          test -n "$MLFLOW_TRACKING_PASSWORD"
          python src/train.py


      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload candidate model and metrics to Cloud Storage
        # Candidate duoc cach ly khoi models/latest cho den khi qua tat ca quality gates.
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          candidate_prefix = f"models/candidates/{os.environ['GITHUB_SHA']}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          blob_model = bucket.blob(f"{candidate_prefix}/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print(f"Uploaded candidate model to gs://{bucket_name}/{candidate_prefix}/model.pkl")

          blob_metrics = bucket.blob(f"{candidate_prefix}/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print(f"Uploaded candidate metrics to gs://{bucket_name}/{candidate_prefix}/metrics.json")
          EOF

      - name: Save metrics and performance report as artifact
        # BONUS 3: Luu tru ca metrics.json va report.txt thanh artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70) & Guardrail Rollback (Bonus 4).
  # Pipeline dung lai neu candidate thap hon nguong hoac kem model production.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-cloud-storage

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Check eval gate & model rollback guardrail
        # BONUS 4: So sanh candidate voi metrics production truoc khi promote.
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import json
          import os

          from google.cloud import storage
          from src.eval_gate import QualityGateError, validate_candidate

          new_acc = float("${{ needs.train.outputs.accuracy }}")
          bucket_name = os.environ["CLOUD_BUCKET"]
          candidate_prefix = f"models/candidates/{os.environ['GITHUB_SHA']}"

          client = storage.Client()
          bucket = client.bucket(bucket_name)

          print("--- [EVALUATION GATE] ---")
          print(f"New Model Accuracy: {new_acc:.4f}")

          production_acc = None
          production_metrics = bucket.blob("models/latest/metrics.json")
          if production_metrics.exists():
              production_metrics.download_to_filename("/tmp/production_metrics.json")
              with open("/tmp/production_metrics.json", encoding="utf-8") as f:
                  production_acc = float(json.load(f)["accuracy"])
              print(f"Production Model Accuracy: {production_acc:.4f}")
          else:
              print("No production metrics found; applying the minimum quality gate only.")

          for filename in ("model.pkl", "metrics.json"):
              candidate_blob = bucket.blob(f"{candidate_prefix}/{filename}")
              if not candidate_blob.exists():
                  raise SystemExit(
                      f"FAILED: candidate artifact gs://{bucket_name}/"
                      f"{candidate_prefix}/{filename} does not exist."
                  )

          try:
              validate_candidate(new_acc, production_acc)
          except QualityGateError as exc:
              raise SystemExit(f"FAILED: {exc}") from exc

          print("PASSED: accuracy >= 0.70 and candidate is not worse than production.")
          print("ALL EVAL GATES PASSED: candidate is ready for production promotion.")
          EOF



  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Cloud Storage dependency
        run: pip install google-cloud-storage

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Promote approved candidate to production
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          candidate_prefix = f"models/candidates/{os.environ['GITHUB_SHA']}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          for filename in ("model.pkl", "metrics.json"):
              source_name = f"{candidate_prefix}/{filename}"
              destination_name = f"models/latest/{filename}"
              source_blob = bucket.blob(source_name)
              if not source_blob.exists():
                  raise SystemExit(f"Candidate artifact is missing: gs://{bucket_name}/{source_name}")
              bucket.copy_blob(source_blob, bucket, destination_name)
              print(f"Promoted gs://{bucket_name}/{source_name} -> gs://{bucket_name}/{destination_name}")
          EOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            # TODO 8: Cho server san sang roi goi curl /health de xac nhan.
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1

